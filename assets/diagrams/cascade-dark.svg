<title id="t">The cascade and the gate</title>
<desc id="d">Stage 0 checks each candidate without running it. Stage 1 runs the first pairs of search_val, stage 2 all of search_val. Stage 3, the gate, confirms the best on the gate split. The held-out split is only reported.</desc>
