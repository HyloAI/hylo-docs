<title id="t">Robot skill development through task programs</title>
<desc id="d">A task requirement and robot tools produce a program. The program enters the same execution kernel as an existing policy. Runs provide task validation. A baseline comparison is a separate step for an improvement claim, followed by the campaign gate and versioned reuse.</desc>
