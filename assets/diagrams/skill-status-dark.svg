<title id="t">A skill&#x27;s status</title>
<desc id="d">A new skill is proposed. A passed gate or a successful replay verifies it; a failed gate with no gain refutes it; a gain that is not significant leaves it proposed. A verified skill that fails revalidation is deprecated.</desc>
