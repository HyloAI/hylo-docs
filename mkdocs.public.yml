# The public documentation site: product docs only (no research notes, strategy summary, RFCs or internal design
# documents). Deployed to https://hyloai.github.io/hylo-docs/ with:
#   uv run mkdocs gh-deploy -f docs/mkdocs.public.yml --force      (from the development workspace)
INHERIT: mkdocs.yml
site_url: https://hyloai.github.io/hylo-docs/
site_dir: site-public
repo_url: https://github.com/HyloAI/hylo-docs
repo_name: HyloAI/hylo-docs
copyright: Copyright 2026 Hylo AI · Apache License 2.0
exclude_docs: |
  *.inc.md
  research/
  internal/
  rfcs/
  EXECUTIVE-SUMMARY.md
  design/*
  !design/overview.md
  assets/figures/studio-*.png
  developer-guide/docs.md
  showcase/studio.md
  showcase/assets/studio/
hooks:
  - mkdocs/public_hook.py

# Navigation is inherited; public_hook removes the internal section and excluded pages.
