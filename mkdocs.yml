site_name: Hylo
site_description: "Agents act in worlds, learn from experience and reuse verified skills. Hylo connects those capabilities through a measured improvement loop."
docs_dir: docs
site_dir: site
edit_uri: ""
exclude_docs: |
  *.inc.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle: {icon: material/brightness-auto, name: Switch to light mode}
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/brightness-4, name: Switch to system preference}
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.share
    - toc.follow

extra:
  homepage: https://hyloai.github.io/

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/reference-links.js
  - assets/javascripts/content-details.js
  - assets/javascripts/toc.js

hooks:
  - mkdocs/redirects.py

plugins:
  - search
  - glightbox
  - gen-files:
      scripts:
        - mkdocs/gen_pages.py
  - mkdocstrings:
      handlers:
        python:
          paths:
            - ../harness/packages/hylo-core/src
            - ../harness/packages/hylo-eval/src
            - ../harness/packages/hylo-agents/src
            - ../harness/packages/hylo-instruments/src
            - ../harness/packages/hylo-reasoners/src
            - ../harness/packages/hylo-memory/src
            - ../harness/packages/hylo-learn/src
            - ../harness/packages/hylo-evolve/src
            - ../harness/packages/hylo-catalog/src
            - ../harness/packages/hylo-policies/src
            - ../harness/packages/hylo-cli/src
            - ../harness/packages/hylo-manip/src
            - ../harness/adapters/hylo-code-agents/src
            - ../harness/adapters/hylo-tools/src
            - ../harness/adapters/hylo-policy-lerobot/src
            - ../harness/adapters/hylo-policy-openpi/src
            - ../harness/adapters/hylo-policy-simplememvla/src
            - ../harness/adapters/hylo-reasoner-llm/src
            - ../harness/adapters/hylo-proposer-llm/src
            - ../harness/adapters/hylo-data-video/src
            - ../bench/packages/hylo-bench/src
            - ../bench/packages/hylo-robosuite-contract/src
            - ../bench/adapters/hylo-env-mujoco/src
            - ../bench/adapters/hylo-env-libero/src
            - ../bench/adapters/hylo-env-robosuite/src
            - ../bench/adapters/hylo-env-robocasa/src
            - ../serve/packages/hylo-serve/src
            - ../serve/adapters/hylo-env-lerobot-robot/src
            - ../studio/packages/hylo-playground/src
            - ../plugins/packages/hylo-plugin-examples/src
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            docstring_style: google
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]
            merge_init_into_class: true

markdown_extensions:
  - attr_list
  - def_list
  - md_in_html
  - tables
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc: {permalink: true}

# Detail pages are reached through their command/package indexes.
not_in_nav: |
  api/modules/
  api/packages/
  cli/commands/
  developer-guide/validation/tool-agents-*.md
