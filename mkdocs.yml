site_name: worldcurrent
site_description: Evaluation, learning, gated self-improvement and deployment for robot policies, behind one set of contracts.
docs_dir: docs
site_dir: site
edit_uri: ""
exclude_docs: |
  *.inc.md

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle: {icon: material/brightness-auto, name: Switch to light mode}
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/brightness-4, name: Switch to system preference}
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.share
    - toc.follow

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search
  - glightbox
  - gen-files:
      scripts:
        - mkdocs/gen_pages.py
  - mkdocstrings:
      handlers:
        python:
          paths:
            - ../harness/packages/wc-core/src
            - ../harness/packages/wc-eval/src
            - ../harness/packages/wc-agents/src
            - ../harness/packages/wc-learn/src
            - ../harness/packages/wc-evolve/src
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            docstring_style: google
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]
            merge_init_into_class: true

markdown_extensions:
  - attr_list
  - def_list
  - md_in_html
  - tables
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc: {permalink: true}

