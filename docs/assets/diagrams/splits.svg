<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 216" width="960" height="216" role="img" aria-labelledby="title desc">
<title id="title">The four splits and who reads each</title>
<desc id="desc">A benchmark&#x27;s episodes are split four ways: search (40 percent) is read by diagnosis and generators; search_val (20 percent) by screening and learners; gate (20 percent) by the gate; heldout (20 percent) only for the report to the approver.</desc>
<defs><style>
  text { font-family: IBM Plex Sans, Helvetica, Arial, sans-serif; fill: #1e293b; }
  .n { font-size: 17px; font-weight: 600; }
  .e { font-size: 15px; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 5px;
        stroke-linejoin: round; }
  .h { font-size: 18px; font-weight: 700; }
  .g { font-size: 17px; font-weight: 700; fill: #0d5c63; }
</style><marker id="a-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="a-0d5c63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d5c63"/></marker><marker id="a-1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker></defs>
<rect width="960" height="216" fill="#ffffff"/>
<rect x="42" y="40" width="348" height="60" rx="8" fill="#e3f0f1" stroke="#0d5c63" stroke-width="1.5"/>
<text x="216.0" y="76.0" class="n" text-anchor="middle">search</text>
<path d="M216.0,104 L216.0,140" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a-475569)"/>
<text x="216.0" y="166" class="n" text-anchor="middle">Diagnosis and</text>
<text x="216.0" y="188" class="n" text-anchor="middle">generators</text>
<rect x="394" y="40" width="172" height="60" rx="8" fill="#e3f0f1" stroke="#0d5c63" stroke-width="1.5"/>
<text x="480.0" y="76.0" class="n" text-anchor="middle">search_val</text>
<path d="M480.0,104 L480.0,140" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a-475569)"/>
<text x="480.0" y="166" class="n" text-anchor="middle">Screening and</text>
<text x="480.0" y="188" class="n" text-anchor="middle">learners</text>
<rect x="570" y="40" width="172" height="60" rx="8" fill="#0d5c63" stroke="#0d5c63" stroke-width="1.5"/>
<text x="656.0" y="76.0" class="n" text-anchor="middle" style="fill:#ffffff">gate</text>
<path d="M656.0,104 L656.0,140" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a-475569)"/>
<text x="656.0" y="166" class="n" text-anchor="middle">The gate</text>
<rect x="746" y="40" width="172" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="832.0" y="76.0" class="n" text-anchor="middle">heldout</text>
<path d="M832.0,104 L832.0,140" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a-475569)"/>
<text x="832.0" y="166" class="n" text-anchor="middle">Report to</text>
<text x="832.0" y="188" class="n" text-anchor="middle">the approver</text>
</svg>
