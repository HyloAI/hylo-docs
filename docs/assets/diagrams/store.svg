<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
<title id="title">The run and artifact store</title>
<desc id="desc">Runs and sealed artifacts get ids; configs reference ids that the registry resolves to this machine&#x27;s paths; the index records provenance and referrers; deletion is refused while referred to; stores sync between machines.</desc>
<defs><style>
  text { font-family: IBM Plex Sans, Helvetica, Arial, sans-serif; fill: #334155; }
  .t { font-size: 13px; font-weight: 600; }
  .s { font-size: 11px; fill: #64748b; }
  .h { font-size: 15px; font-weight: 700; }
  .cap { font-size: 11px; font-weight: 600; letter-spacing: .06em; fill: #64748b; }
  .m { font-family: IBM Plex Mono, Menlo, Consolas, monospace; font-size: 11px; }
  .w { fill: #ffffff; }
</style><marker id="a-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-0d5c63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d5c63"/></marker><marker id="a-2a7f86" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7f86"/></marker><marker id="a-c2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="a-334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="960" height="600" fill="#ffffff"/>
<rect x="20" y="20" width="580" height="500" rx="12" fill="#e6f2f3" stroke="#2a7f86" stroke-width="1.2"/>
<text x="36" y="44" class="cap" text-anchor="start" fill="#0d5c63">ONE STORE (the profile&#x27;s store: …/runs)</text>
<rect x="36" y="60" width="270" height="28" rx="6" fill="#fff" stroke="#2a7f86" stroke-width="1"/>
<text x="46" y="79" class="m" text-anchor="start" fill="#0d5c63">run:rsi-l10-parent-search-…31f1e5</text>
<rect x="36" y="98" width="270" height="28" rx="6" fill="#fff" stroke="#2a7f86" stroke-width="1"/>
<text x="46" y="117" class="m" text-anchor="start" fill="#0d5c63">run:libero10-steered-…9b8983</text>
<rect x="36" y="136" width="270" height="28" rx="6" fill="#fff" stroke="#2a7f86" stroke-width="1"/>
<text x="46" y="155" class="m" text-anchor="start" fill="#0d5c63">run:libero10-steered-…d528f7</text>
<rect x="380" y="84" width="204" height="56" rx="8" fill="#fff" stroke="#0d5c63" stroke-width="1.6"/>
<text x="392" y="106" class="m" text-anchor="start" fill="#0d5c63" font-weight="600">artifact:l10-trace-v2</text>
<text x="392" y="124" class="m" text-anchor="start" fill="#0d5c63">@54a1efadf00d34d8</text>
<path d="M308,74 L376,112" fill="none" stroke="#2a7f86" stroke-width="1.5" marker-end="url(#a-2a7f86)"/>
<path d="M308,112 L376,112" fill="none" stroke="#2a7f86" stroke-width="1.5" marker-end="url(#a-2a7f86)"/>
<path d="M308,150 L376,112" fill="none" stroke="#2a7f86" stroke-width="1.5" marker-end="url(#a-2a7f86)"/>
<text x="392" y="76" class="s" text-anchor="start">provenance: built from</text>
<rect x="36" y="186" width="270" height="46" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
<text x="46" y="206" class="m" text-anchor="start">campaign:evolve/…</text>
<text x="46" y="223" class="s" text-anchor="start">archive.jsonl, registry ledger</text>
<path d="M308,209 C370,209 420,190 430,144" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a-c2410c)"/>
<text x="440" y="190" class="s" text-anchor="start" fill="#c2410c" font-weight="600">refers to</text>
<text x="440" y="206" class="s" text-anchor="start" fill="#c2410c">(ids in candidate patches)</text>
<text x="36" y="266" class="cap" text-anchor="start" fill="#0d5c63">A CONFIG NAMES CONTENT, NOT A PLACE</text>
<rect x="36" y="276" width="548" height="30" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
<text x="48" y="296" class="m" text-anchor="start">judge: {path: &quot;artifact:l10-trace-v2@54a1efad&quot;}</text>
<path d="M120,308 L120,334" fill="none" stroke="#2a7f86" stroke-width="1.5" marker-end="url(#a-2a7f86)"/>
<text x="132" y="322" class="s" text-anchor="start">digest taken over the id; registry.build then resolves it</text>
<rect x="36" y="338" width="548" height="30" rx="6" fill="#fff" stroke="#2a7f86" stroke-width="1"/>
<text x="48" y="358" class="m" text-anchor="start" fill="#0d5c63">/home/you/…/runs/judges/l10-trace-v2  (pinned in the run)</text>
<rect x="36" y="392" width="548" height="110" rx="8" fill="#fdeee6" stroke="#c2410c" stroke-width="1.2"/>
<text x="48" y="414" class="m" text-anchor="start" fill="#c2410c" font-weight="600">hylo store rm run:rsi-l10-parent-search-…</text>
<text x="48" y="434" class="s" text-anchor="start">refused: referred to by artifact:l10-trace-v2@… and 3 more</text>
<text x="48" y="456" class="m" text-anchor="start" fill="#c2410c">hylo store rm … --force --reason &quot;…&quot;</text>
<text x="48" y="476" class="s" text-anchor="start">deletes and appends a tombstone: a later lookup of the id says</text>
<text x="48" y="492" class="s" text-anchor="start">when and why it was removed, instead of &quot;not found&quot;</text>
<text x="624" y="44" class="cap" text-anchor="start">BETWEEN MACHINES (rsync over ssh)</text>
<rect x="640" y="60" width="290" height="70" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="785.0" y="92.0" class="t" text-anchor="middle">robot computer</text>
<text x="785.0" y="106.0" class="s" text-anchor="middle">workcell episodes</text>
<rect x="640" y="230" width="290" height="70" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="785.0" y="262.0" class="t" text-anchor="middle">workstation</text>
<text x="785.0" y="276.0" class="s" text-anchor="middle">the main store</text>
<rect x="640" y="400" width="290" height="70" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="785.0" y="432.0" class="t" text-anchor="middle">GPU box</text>
<text x="785.0" y="446.0" class="s" text-anchor="middle">policy server, training</text>
<path d="M720,132 L720,226" fill="none" stroke="#0d5c63" stroke-width="1.5" marker-end="url(#a-0d5c63)"/>
<text x="728" y="176" class="s" text-anchor="start" fill="#0d5c63" font-weight="600">pull: runs</text>
<path d="M876,226 L876,132" fill="none" stroke="#c2410c" stroke-width="1.5" marker-end="url(#a-c2410c)"/>
<text x="868" y="194" class="s" text-anchor="end" fill="#c2410c" font-weight="600">push: artifacts</text>
<path d="M720,396 L720,302" fill="none" stroke="#0d5c63" stroke-width="1.5" marker-end="url(#a-0d5c63)"/>
<text x="728" y="346" class="s" text-anchor="start" fill="#0d5c63" font-weight="600">pull: runs, artifacts</text>
<path d="M876,302 L876,396" fill="none" stroke="#c2410c" stroke-width="1.5" marker-end="url(#a-c2410c)"/>
<text x="868" y="364" class="s" text-anchor="end" fill="#c2410c" font-weight="600">push: artifacts</text>
<text x="624" y="482" class="s" text-anchor="start" fill="#64748b">(run on the workstation)</text>
<text x="624" y="499" class="m" text-anchor="start" fill="#334155">hylo store pull robot:/path/runs</text>
<text x="624" y="516" class="m" text-anchor="start" fill="#334155">hylo store push robot:/path/runs artifact:…</text>
<text x="624" y="533" class="s" text-anchor="start" fill="#64748b">Sealed artifacts are never re-copied or</text>
<text x="624" y="550" class="s" text-anchor="start" fill="#64748b">overwritten; the same path holding something</text>
<text x="624" y="567" class="s" text-anchor="start" fill="#64748b">else is a conflict: nothing is copied.</text>
<text x="36" y="548" class="s" text-anchor="start">ids: run:&lt;run_id&gt; · artifact:&lt;name&gt;@&lt;digest&gt; (a prefix of ≥ 8 hex characters works)</text>
<text x="36" y="566" class="s" text-anchor="start">index: &lt;store&gt;/.hylo-store/index.json, a cache rebuilt by walking the tree on a miss</text>
<text x="930" y="596" class="m" text-anchor="end" fill="#64748b">hylo.core.store · hylo store</text>
</svg>
