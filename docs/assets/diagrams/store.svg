<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc">
<title id="title">The run and artifact store</title>
<desc id="desc">In one store, every run and artifact has an id. An artifact records the runs it was built from and campaigns refer to runs and artifacts. A config, outside the store, names an artifact by id. Between machines, the workstation pulls runs from the robot computer and pushes artifacts to the GPU box.</desc>
