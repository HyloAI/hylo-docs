<title id="t">From protocol to leaderboard</title>
<desc id="d">A policy and a protocol (benchmark, split, environment, safety limits, seed) go into hylo bench run, which writes runs with traces and a scorecard. Scorecards with the same protocol are comparable: they rank on a leaderboard and compare episode by episode.</desc>
