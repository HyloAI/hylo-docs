<title id="t">The robot skill lifecycle</title>
<desc id="d">Develop, run and validate a robot skill implementation, version it, deploy it, reuse it and improve it. Task scope, implementation, evidence and dependencies stay explicit. These are user activities mapped to the existing mechanisms, not a universal skill status machine.</desc>
