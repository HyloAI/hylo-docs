<title id="t">One round with experience</title>
<desc id="d">The proposer reads lessons and skill status and proposes candidates. The campaign&#x27;s gate decides them and the archive records the verdicts. From the archive, skills are derived and the lessons that candidates cited are credited; a reflector adds lesson operations from development episodes.</desc>
