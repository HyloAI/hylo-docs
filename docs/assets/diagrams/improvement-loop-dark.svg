<title id="t">One improvement cycle</title>
<desc id="d">A campaign cycle: start from the parent, diagnose its failures, generate candidates, screen them, confirm the best at the gate, approve, and promote; the promoted version is the next cycle&#x27;s parent. Every candidate is archived, and generators can read the archive.</desc>
