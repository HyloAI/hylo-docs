<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
<title id="title">How data flows through Hylo</title>
<desc id="desc">Run: an experiment produces a run with its traces. Measure: an evaluation protocol scores runs into a scorecard. Improve: a learner turns runs into an artifact, which becomes a candidate, and the gate decides. Deploy: the promoted active version runs on a workcell, whose episodes come back as runs.</desc>
<defs><style>
  text { font-family: IBM Plex Sans, Helvetica, Arial, sans-serif; fill: #1e293b; }
  .n { font-size: 17px; font-weight: 600; }
  .e { font-size: 15px; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 5px;
        stroke-linejoin: round; }
  .h { font-size: 18px; font-weight: 700; }
  .g { font-size: 17px; font-weight: 700; fill: #0d5c63; }
</style><marker id="a-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="a-0d5c63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d5c63"/></marker><marker id="a-1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker></defs>
<rect width="960" height="440" fill="#ffffff"/>
<line x1="40" y1="62" x2="490" y2="62" stroke="#0d5c63" stroke-width="2"/>
<text x="40" y="52" class="g" text-anchor="start">Run</text>
<line x1="580" y1="62" x2="760" y2="62" stroke="#0d5c63" stroke-width="2"/>
<text x="580" y="52" class="g" text-anchor="start">Measure</text>
<rect x="40" y="96" width="170" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="125.0" y="134.0" class="n" text-anchor="middle">Experiment</text>
<rect x="300" y="96" width="190" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="395.0" y="134.0" class="n" text-anchor="middle">Run and traces</text>
<rect x="580" y="96" width="180" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="670.0" y="134.0" class="n" text-anchor="middle">Scorecard</text>
<path d="M212,128.0 L296,128.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a-475569)"/>
<path d="M492,128.0 L576,128.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a-475569)"/>
<rect x="26" y="296" width="140" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="96.0" y="334.0" class="n" text-anchor="middle">Artifact</text>
<rect x="218" y="296" width="140" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="288.0" y="334.0" class="n" text-anchor="middle">Candidate</text>
<rect x="410" y="296" width="140" height="64" rx="10" fill="#0d5c63" stroke="#0d5c63" stroke-width="1.5"/>
<text x="480.0" y="334.0" class="n" text-anchor="middle" style="fill:#ffffff">Gate</text>
<rect x="602" y="296" width="140" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="672.0" y="323.5" class="n" text-anchor="middle">Active</text>
<text x="672.0" y="344.5" class="n" text-anchor="middle">version</text>
<rect x="794" y="296" width="140" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="864.0" y="334.0" class="n" text-anchor="middle">Workcell</text>
<path d="M168,328.0 L214,328.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a-475569)"/>
<path d="M360,328.0 L406,328.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a-475569)"/>
<path d="M552,328.0 L598,328.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a-475569)"/>
<path d="M744,328.0 L790,328.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a-475569)"/>
<line x1="26" y1="392" x2="550" y2="392" stroke="#0d5c63" stroke-width="2"/>
<text x="26" y="416" class="g" text-anchor="start">Improve</text>
<line x1="602" y1="392" x2="934" y2="392" stroke="#0d5c63" stroke-width="2"/>
<text x="602" y="416" class="g" text-anchor="start">Deploy</text>
<path d="M350,162 L350,228 L96,228 L96,292" fill="none" stroke="#0d5c63" stroke-width="2" marker-end="url(#a-0d5c63)"/>
<text x="223" y="220" class="e" text-anchor="middle">learn</text>
<path d="M864,294 L864,228 L440,228 L440,164" fill="none" stroke="#0d5c63" stroke-width="2" marker-end="url(#a-0d5c63)"/>
<text x="652" y="220" class="e" text-anchor="middle">episodes become runs</text>
</svg>
