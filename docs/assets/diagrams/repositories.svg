<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
<title id="title">Hylo repositories and how they depend on each other</title>
<desc id="desc">bench, serve, studio and plugins depend only on the harness and never import each other; they cooperate through formats defined in hylo-core. serve declares only hylo-core, so a robot computer installs little.</desc>
