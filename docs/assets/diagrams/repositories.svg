<title id="title">Hylo repositories and how they depend on each other</title>
<desc id="desc">bench, serve, studio and plugins each depend only on the harness and never on each other. serve depends on hylo-core alone, so a robot computer installs little. docs and the deployments template hold no code.</desc>
