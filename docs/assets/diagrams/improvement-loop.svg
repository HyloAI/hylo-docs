<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="title desc">
<title id="title">One improvement cycle</title>
<desc id="desc">A campaign cycle: start from the parent, diagnose its failures, generate candidates, screen them, confirm the best at the gate, approve, and promote; the promoted version is the next cycle&#x27;s parent. Every candidate is archived, and generators can read the archive.</desc>
