<title id="t">The four splits and who reads each</title>
<desc id="d">A benchmark&#x27;s episodes are split four ways: search (40 percent) is read by diagnosis and generators; search_val (20 percent) by screening and learners; gate (20 percent) by the gate; heldout (20 percent) only for the report to the approver.</desc>
