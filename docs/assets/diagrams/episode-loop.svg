<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc">
<title id="title">One episode loop, two timings</title>
<desc id="desc">In sync mode the world waits while the policy computes each chunk. In realtime mode the robot keeps moving: the next chunk is computed while the current one runs, and the robot holds until the first chunk arrives.</desc>
