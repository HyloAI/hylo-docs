<path d="M262,58 L262,114" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a-334155)"/>
<text x="292" y="40" class="s" text-anchor="start" fill="#334155" font-weight="600">HTTP :8765</text>
<path d="M286,144 L342,144" fill="none" stroke="#0d5c63" stroke-width="1.5" marker-end="url(#a-0d5c63)"/>
<text x="314" y="134" class="s" text-anchor="middle" fill="#0d5c63" font-weight="600">HTTP</text>
<path d="M616,210 L644,210 L644,152 L672,152" fill="none" stroke="#0d5c63" stroke-width="1.5" marker-end="url(#a-0d5c63)"/>
<path d="M330,289 L288,289" fill="none" stroke="#2a7f86" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-2a7f86)"/>
<path d="M160,382 L160,590 L924,590 L924,294" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-c2410c)"/>
<text x="600" y="582" class="s" text-anchor="middle" fill="#c2410c">wc serve policy --campaign DIR serves the active version</text>
<text x="660" y="330" class="cap" text-anchor="start">LINKS</text>
<path d="M660,352 L700,352" fill="none" stroke="#0d5c63" stroke-width="2"/>
<text x="710" y="356" class="s" text-anchor="start">HTTP workcell API</text>
<path d="M660,374 L700,374" fill="none" stroke="#0d5c63" stroke-width="2"/>
<text x="710" y="378" class="s" text-anchor="start">websocket: obs → chunk</text>
<path d="M660,396 L700,396" fill="none" stroke="#2a7f86" stroke-width="2" stroke-dasharray="5 4"/>
<text x="710" y="400" class="s" text-anchor="start">wc store pull: runs</text>
<path d="M660,418 L700,418" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/>
<text x="710" y="422" class="s" text-anchor="start">promoted version</text>
<text x="20" y="616" class="s" text-anchor="start">Workcell API: /status /episodes /operator /events. Ports as in the examples: policy 8001 (8002 for the bring-up wave), workcells</text>
<text x="20" y="632" class="s" text-anchor="start">8101 / 8102, playground 8765. Tokens are passed with --token, never in configs.</text>
