<text x="480.0" y="268.0" class="t" text-anchor="middle" fill="#c2410c">SafetyShield</text>
<text x="480.0" y="282.0" class="s" text-anchor="middle">guards, workspace, keep-out,</text>
<text x="480.0" y="296.0" class="s" text-anchor="middle">latched e-stop, watchdog</text>
<rect x="346" y="318" width="268" height="44" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="480.0" y="337.5" class="t" text-anchor="middle">lerobot.robot</text>
<text x="480.0" y="350.5" class="s" text-anchor="middle">robot adapter (LeRobot Robot)</text>
<rect x="346" y="374" width="268" height="56" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="480.0" y="392.0" class="t" text-anchor="middle">operator channel</text>
<text x="480.0" y="406.0" class="s" text-anchor="middle">stop, e-stop, clear fault,</text>
<text x="480.0" y="420.0" class="s" text-anchor="middle">reset done, verdict</text>
<path d="M480,452 L480,488" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a-334155)"/>
<text x="488" y="476" class="s" text-anchor="start">joint targets</text>
<rect x="385" y="490" width="190" height="50" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="480.0" y="512.5" class="t" text-anchor="middle">robot arm</text>
<text x="480.0" y="525.5" class="s" text-anchor="middle">SO-101, or the simulated arm</text>
<rect x="660" y="70" width="280" height="220" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
<text x="674" y="92" class="h" text-anchor="start">GPU box</text>
<text x="674" y="108" class="s" text-anchor="start">inference</text>
<rect x="676" y="118" width="248" height="70" rx="8" fill="#fff" stroke="#2a7f86" stroke-width="1.2"/>
<text x="800.0" y="143.0" class="t" text-anchor="middle" fill="#0d5c63">wc serve policy :8001</text>
<text x="800.0" y="157.0" class="s" text-anchor="middle">websocket /wc, msgpack-numpy</text>
<text x="800.0" y="171.0" class="s" text-anchor="middle">(or the openpi protocol)</text>
<rect x="676" y="200" width="248" height="54" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="800.0" y="224.0" class="t" text-anchor="middle">policy weights</text>
