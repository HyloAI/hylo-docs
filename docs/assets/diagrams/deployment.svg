<text x="160.0" y="31.5" class="t" text-anchor="middle" font-size="12">operator&#x27;s browser</text>
<text x="160.0" y="44.5" class="s" text-anchor="middle">studio UI: start, watch, stop, label</text>
<rect x="20" y="70" width="280" height="330" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
<text x="34" y="92" class="h" text-anchor="start">Workstation</text>
<text x="34" y="108" class="s" text-anchor="start">studio, campaigns, the main store</text>
<rect x="36" y="118" width="248" height="62" rx="8" fill="#fff" stroke="#2a7f86" stroke-width="1.2"/>
<text x="160.0" y="139.0" class="t" text-anchor="middle" fill="#0d5c63">wc playground :8765</text>
<text x="160.0" y="153.0" class="s" text-anchor="middle">control plane, run explorer,</text>
<text x="160.0" y="167.0" class="s" text-anchor="middle">live sandbox, campaigns</text>
<rect x="36" y="194" width="248" height="54" rx="8" fill="#fff" stroke="#2a7f86" stroke-width="1.2"/>
<text x="160.0" y="218.0" class="t" text-anchor="middle" fill="#0d5c63">wc evolve · wc bench</text>
<text x="160.0" y="232.0" class="s" text-anchor="middle">campaigns, the gate, scorecards</text>
<rect x="36" y="262" width="248" height="54" rx="8" fill="#fff" stroke="#2a7f86" stroke-width="1.2"/>
<text x="160.0" y="286.0" class="t" text-anchor="middle" fill="#0d5c63">store</text>
<text x="160.0" y="300.0" class="s" text-anchor="middle">runs and artifacts by id</text>
<rect x="36" y="330" width="248" height="50" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.2"/>
<text x="160.0" y="352.0" class="t" text-anchor="middle" fill="#c2410c">active.json</text>
<text x="160.0" y="366.0" class="s" text-anchor="middle">the promoted version</text>
<rect x="330" y="70" width="300" height="380" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
<text x="344" y="92" class="h" text-anchor="start">Robot computer</text>
<text x="344" y="108" class="s" text-anchor="start">installs wc-core + wc-serve only</text>
<rect x="346" y="118" width="268" height="52" rx="8" fill="#fff" stroke="#2a7f86" stroke-width="1.2"/>
