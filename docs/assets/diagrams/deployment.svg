<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" role="img" aria-labelledby="title desc">
<title id="title">Deployment topology</title>
<desc id="desc">The workstation runs Studio and holds the store. The robot computer runs the workcell, with the episode loop and the safety shield, and drives the robot arm. A GPU box runs the policy server, which serves the promoted version. Studio talks to the workcell over HTTP, the workcell to the policy server over a WebSocket, and the workcell&#x27;s runs are copied to the store.</desc>
