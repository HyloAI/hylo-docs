<rect x="346" y="182" width="268" height="56" rx="8" fill="#fff" stroke="#2a7f86" stroke-width="1.2"/>
<text x="480.0" y="207.0" class="t" text-anchor="middle" fill="#0d5c63">EpisodeRunner</text>
<text x="480.0" y="221.0" class="s" text-anchor="middle">core.kernel: realtime timing, wall clock</text>
